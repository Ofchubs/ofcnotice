name: Run Notice Scraper Bot

on:
  schedule:
    - cron: '*/30 * * * *'  # প্রতি ৩০ মিনিট পরপর চলবে
  workflow_dispatch:        # গিটহাব থেকে ম্যানুয়ালি রান করার বাটন

permissions:
  contents: write           # Error 403 প্রতিরোধের জন্য Write পারমিশন

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3

      - name: Run Scraper Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ofcnotice_bot.py

      - name: Commit and Push Updated sent_notices.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_notices.txt
          git commit -m "chore: update sent notices log [skip ci]" || exit 0
          git push

