name: Run Notice Scraper Bot

on:
  schedule:
    # বাংলাদেশ সময় সকাল 7:30 AM থেকে রাত 2:30 AM পর্যন্ত প্রতি ২০ মিনিট পরপর অটোমেটিক চলবে
    - cron: '30,50 1 * * *'       # UTC 1:30, 1:50 (বাংলাদেশ সময় 7:30 AM, 7:50 AM)
    - cron: '10,30,50 2-19 * * *' # UTC 2:10 থেকে 19:50 পর্যন্ত (বাংলাদেশ সময় 8:10 AM থেকে 1:50 AM)
    - cron: '10,30 20 * * *'      # UTC 20:10, 20:30 (বাংলাদেশ সময় 2:10 AM, 2:30 AM)
  workflow_dispatch:            # ব্যাকআপ হিসেবে ম্যানুয়ালি রান করার অপশন

permissions:
  contents: write               # Error 403 প্রতিরোধের জন্য Write পারমিশন

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3

      - name: Run Scraper Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ofcnotice_bot.py

      - name: Commit and Push Updated sent_notices.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_notices.txt
          git commit -m "chore: update sent notices log [skip ci]" || exit 0
          git push
