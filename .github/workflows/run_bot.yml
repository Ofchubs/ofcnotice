name: Run Notice Scraper Bot

on:
  schedule:
    # বাংলাদেশ সময় সকাল 7:30 AM থেকে রাত 2:00 AM পর্যন্ত অটোমেটিক প্রতি ৩০ মিনিট পরপর চলবে
    # (UTC সময় 1:30 AM থেকে 8:00 PM)
    - cron: '30 1-19/1 * * *'   # UTC 1:30, 2:30, ..., 19:30 (বাংলাদেশ সময় 7:30 AM - 1:30 AM)
    - cron: '0 2-20/1 * * *'    # UTC 2:00, 3:00, ..., 20:00 (বাংলাদেশ সময় 8:00 AM - 2:00 AM)
  workflow_dispatch:            # ব্যাকআপ হিসেবে ম্যানুয়ালি রান করার অপশন (প্রয়োজন না হলে ব্যবহার করতে হবে না)

permissions:
  contents: write               # Error 403 প্রতিরোধের জন্য Write পারমিশন

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3

      - name: Run Scraper Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ofcnotice_bot.py

      - name: Commit and Push Updated sent_notices.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_notices.txt
          git commit -m "chore: update sent notices log [skip ci]" || exit 0
          git push
